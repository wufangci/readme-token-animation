<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}#gl{position:absolute;left:-99999px}</style>
<script src="../node_modules/three/build/three.min.js"></script>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<canvas id="gl" width="1920" height="1080"></canvas>
<script>
/*
  How a vision model reads one photograph (CLIP ViT-L/14-336, as used by LLaVA):
  file bytes → decode (8×8 / 16×16 blocks) → pad to a square with the CLIP mean colour and shrink to 336 × 336
  → cut into 24 × 24 = 576 patches of 14 × 14 px → each patch flattened to 14·14·3 = 588 numbers
  → projected to a 1024-d vector → attention between patches (bidirectional) → the language model answers in text tokens.
  One rule throughout: every change sweeps through the patches in raster order (the order the model flattens them).
*/
const W = 1920, H = 1080, END = 30, P = 24, NP = P * P;
const MONO = '"DejaVu Sans Mono"';
const TS = [null, 0.3, 4, 7.2, 11, 15.2, 19.2, 25, 28.2];   // stage starts; stage 8 = forgetting
const SW = 2.6, DU = .9;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = x => x * x * (3 - 2 * x);
const lerp = (a, b, f) => a + (b - a) * f;
function rnd(i, k = 0) { let x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }
function sw(i, n, k, t, swl = SW, du = DU) { const s = TS[k] + (i / n) * swl; return ease(seg(t, s, s + du)); }
function stageIndex(t) { for (let k = 8; k >= 1; k--) if (t >= TS[k]) return k; return 1; }

const out = document.getElementById('c'), octx = out.getContext('2d'), glc = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0xffffff, 1);
const scene = new THREE.Scene(), cam = new THREE.PerspectiveCamera(35, W / H, .1, 300);
let META, M = {}, TEX = {};

function loadTex(url, nearest) {
  return new Promise(res => new THREE.TextureLoader().load(url, t => {
    if (nearest) { t.magFilter = THREE.NearestFilter; t.minFilter = THREE.NearestFilter; t.generateMipmaps = false; }
    else { t.anisotropy = 8; }
    res(t);
  }));
}

// ---------- geometry constants ----------
const IW = 16, IH = 16 * 1279 / 2268;        // original picture plane
const SQ = 9.6, TILE = SQ / P;               // padded square and patch size
function tileXY(i) { const r = Math.floor(i / P), c = i % P; return [-SQ / 2 + (c + .5) * TILE, SQ / 2 - (r + .5) * TILE]; }
function helix(i) { const a = i / NP * Math.PI * 2 * 3.2, y = 5.2 - i / NP * 10.4; return [Math.sin(a) * 7.2, y, Math.cos(a) * 7.2, a]; }

async function init(meta) {
  META = meta;
  const base = 'img/';
  [TEX.full, TEX.hex, TEX.hi, TEX.lo] = await Promise.all([loadTex(base + 'full.jpg'), loadTex(base + 'hex.png'), loadTex(base + 'hi_pad.png'), loadTex(base + 'lo_pad.png', true)]);

  // A. the photograph as a file: hex bytes decode into pixels block by block
  M.plane = new THREE.Mesh(new THREE.PlaneGeometry(IW, IH), new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { img: { value: TEX.full }, hexT: { value: TEX.hex }, t: { value: 0 }, t0: { value: TS[1] }, sw: { value: 3.2 }, du: { value: .5 },
                bx: { value: meta.mcu[0] }, by: { value: meta.mcu[1] }, alpha: { value: 1 } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `
      uniform sampler2D img; uniform sampler2D hexT; uniform float t, t0, sw, du, bx, by, alpha; varying vec2 vUv;
      float h(float n){ return fract(sin(n * 127.1) * 43758.5453); }
      void main(){
        float c = floor(vUv.x * bx), r = floor((1.0 - vUv.y) * by), idx = r * bx + c, n = bx * by;
        float s = t0 + idx / n * sw, f = clamp((t - s) / du, 0.0, 1.0);
        float hexIn = clamp((t - (t0 - .2 + (idx / n) * sw * .35)) / .3, 0.0, 1.0);
        vec3 px = texture2D(img, vUv).rgb; float ink = 1.0 - texture2D(hexT, vUv).r;
        float flick = f > 0.0 && f < 1.0 ? step(.45, h(idx + floor(t * 24.0))) : 1.0;
        vec3 col = mix(vec3(1.0) - ink * vec3(.92) * hexIn, px, f * flick);
        gl_FragColor = vec4(col, alpha);
      }`
  }));
  scene.add(M.plane);
  // padding square (CLIP mean colour) that appears behind the shrunk picture
  M.pad = new THREE.Mesh(new THREE.PlaneGeometry(SQ, SQ), new THREE.MeshBasicMaterial({ color: new THREE.Color(122 / 255, 116 / 255, 104 / 255), transparent: true, opacity: 0, depthWrite: false }));
  M.pad.material.color.convertSRGBToLinear(); M.pad.position.z = -.01; scene.add(M.pad);

  // B. 576 patches (instanced): square tile → cut → flattened strip
  { const g0 = new THREE.PlaneGeometry(1, 1), g = new THREE.InstancedBufferGeometry();
    g.index = g0.index; g.setAttribute('position', g0.attributes.position); g.setAttribute('uv', g0.attributes.uv);
    const uvr = new Float32Array(NP * 4);
    for (let i = 0; i < NP; i++) { const r = Math.floor(i / P), c = i % P; uvr.set([c / P, 1 - (r + 1) / P, 1 / P, 1 / P], i * 4); }
    g.setAttribute('uvr', new THREE.InstancedBufferAttribute(uvr, 4));
    for (const [k, n] of [['off', 3], ['sc', 2], ['rot', 1], ['lo', 1], ['strip', 1], ['a', 1]]) g.setAttribute(k, new THREE.InstancedBufferAttribute(new Float32Array(NP * n), n));
    g.instanceCount = NP;
    M.tiles = new THREE.Mesh(g, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, side: THREE.DoubleSide,
      uniforms: { hi: { value: TEX.hi }, loT: { value: TEX.lo } },
      vertexShader: `
        attribute vec4 uvr; attribute vec3 off; attribute vec2 sc; attribute float rot, lo, strip, a;
        varying vec2 vUv; varying vec4 vR; varying float vLo, vS, vA;
        void main(){ vUv = uv; vR = uvr; vLo = lo; vS = strip; vA = a;
          vec2 p = position.xy * sc; vec3 q = vec3(p.x * cos(rot), p.y, -p.x * sin(rot));
          gl_Position = projectionMatrix * modelViewMatrix * vec4(off + q, 1.0); }`,
      fragmentShader: `
        uniform sampler2D hi; uniform sampler2D loT; varying vec2 vUv; varying vec4 vR; varying float vLo, vS, vA;
        void main(){
          vec2 u = vR.xy + vUv * vR.zw;
          vec3 c = mix(texture2D(hi, u).rgb, texture2D(loT, u).rgb, vLo);
          // flattened: the 14×14 pixels read row by row, laid end to end along the strip
          float k = floor((1.0 - vUv.y) * 196.0), px = mod(k, 14.0), py = floor(k / 14.0);
          vec3 s = texture2D(loT, vR.xy + vec2((px + .5) / 14.0, 1.0 - (py + .5) / 14.0) * vR.zw).rgb;
          gl_FragColor = vec4(mix(c, s, vS), vA);
          if (vA < .01) discard;
        }`
    }));
    M.tiles.frustumCulled = false; scene.add(M.tiles); }

  // C. cut lines: 25 + 25 fine lines drawn across the square
  { const pos = []; const u = [], bth = [];
    for (let k = 0; k <= P; k++) {
      const x = -SQ / 2 + k * TILE;
      pos.push(-SQ / 2, x, .02, SQ / 2, x, .02); u.push(0, 1); bth.push(k, k);        // horizontal
      pos.push(x, SQ / 2, .02, x, -SQ / 2, .02); u.push(0, 1); bth.push(k + 25, k + 25); // vertical
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pos), 3));
    g.setAttribute('u', new THREE.BufferAttribute(new Float32Array(u), 1)); g.setAttribute('k', new THREE.BufferAttribute(new Float32Array(bth), 1));
    M.cuts = new THREE.LineSegments(g, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: { t: { value: 0 }, t0: { value: TS[3] + .1 }, alpha: { value: 1 } },
      vertexShader: `attribute float u, k; uniform float t, t0; varying float vV;
        void main(){ float s = t0 + k / 50.0 * 1.6; vV = clamp((t - s) / .6, 0.0, 1.0) - u; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform float alpha; varying float vV; void main(){ if (vV < 0.0) discard; gl_FragColor = vec4(vec3(.06), .8 * alpha); }`
    }));
    M.cuts.frustumCulled = false; scene.add(M.cuts); }

  // D. embedding cloud: each patch becomes a point; placed by its colour statistics (illustrative)
  const F = meta.feats, rank = (arr) => { const o = arr.map((v, i) => [v, i]).sort((a, b) => a[0] - b[0]); const r = new Array(arr.length); o.forEach(([, i], k) => r[i] = k / (arr.length - 1)); return r; };
  const gr = rank(F.map(f => f.m[1] - (f.m[0] + f.m[2]) / 2)), br = rank(F.map(f => f.m[0] + f.m[1] + f.m[2])), vr = rank(F.map(f => f.v));
  M.CL = new Float32Array(NP * 3);
  for (let i = 0; i < NP; i++) {
    if (F[i].pad) { M.CL.set([-6.5 + (rnd(i, 1) - .5) * .04, -4.2 + (rnd(i, 2) - .5) * .04, 2 + (rnd(i, 3) - .5) * .04], i * 3); continue; }  // every padding patch lands on the same spot
    const th = gr[i] * Math.PI * 1.6 - .8, rr = 3 + vr[i] * 5;
    M.CL.set([Math.sin(th) * rr + (rnd(i, 4) - .5) * .8, (br[i] - .5) * 9 + (rnd(i, 5) - .5) * .8, Math.cos(th) * rr * .8 + (rnd(i, 6) - .5) * .8], i * 3);
  }
  { const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(NP * 3), 3));
    g.setAttribute('a', new THREE.BufferAttribute(new Float32Array(NP), 1));
    const col = new Float32Array(NP * 3); F.forEach((f, i) => col.set(f.m.map(x => Math.pow(x, 2.2)), i * 3));
    g.setAttribute('col', new THREE.BufferAttribute(col, 3));
    M.pts = new THREE.Points(g, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: { size: { value: 11 } },
      vertexShader: `attribute float a; attribute vec3 col; uniform float size; varying float vA; varying vec3 vC;
        void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vA = a; vC = col; gl_PointSize = size * (26.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `varying float vA; varying vec3 vC; void main(){ float r = length(gl_PointCoord - .5); if (r > .5 || vA < .01) discard;
        gl_FragColor = vec4(pow(vC, vec3(1.0/2.2)), vA * smoothstep(.5, .35, r)); }`
    }));
    M.pts.frustumCulled = false; scene.add(M.pts); }

  // E. attention arcs between patches (bidirectional for image patches), born in raster order
  { const pairs = [];
    for (let i = 0; i < NP; i++) {
      // nearest neighbour in feature space, plus one spatial neighbour
      let best = -1, bd = 1e9;
      for (let j = 0; j < NP; j++) { if (j === i) continue; const dx = M.CL[i*3]-M.CL[j*3], dy = M.CL[i*3+1]-M.CL[j*3+1], dz = M.CL[i*3+2]-M.CL[j*3+2], d = dx*dx+dy*dy+dz*dz + rnd(i*NP+j, 7) * 2; if (d < bd) { bd = d; best = j; } }
      pairs.push([i, best]);
      const nb = i + (rnd(i, 8) < .5 ? 1 : P) + Math.floor(rnd(i, 9) * 3); if (nb < NP) pairs.push([i, nb]);
    }
    M.arcN = pairs.length;
    const SEGN = 20, pos = new Float32Array(M.arcN * SEGN * 6), uu = new Float32Array(M.arcN * SEGN * 2), bb = new Float32Array(M.arcN * SEGN * 2);
    M.arcBirth = [];
    pairs.forEach(([i, j], q) => {
      const A = new THREE.Vector3(...M.CL.slice(i * 3, i * 3 + 3)), B = new THREE.Vector3(...M.CL.slice(j * 3, j * 3 + 3));
      const Mid = A.clone().add(B).multiplyScalar(.5), o = Mid.clone(); if (o.length() < .01) o.set(0, 1, 0);
      o.normalize().multiplyScalar(A.distanceTo(B) * .45 + .5); const Pm = Mid.add(o);
      const birth = TS[6] + .3 + (i / NP) * 4.4; M.arcBirth.push(birth);
      const pt = u => { const a = (1-u)**2, b = 2*u*(1-u), c = u*u; return [A.x*a+Pm.x*b+B.x*c, A.y*a+Pm.y*b+B.y*c, A.z*a+Pm.z*b+B.z*c]; };
      for (let k = 0; k < SEGN; k++) { const v = (q * SEGN + k) * 2; pos.set(pt(k / SEGN), v * 3); pos.set(pt((k + 1) / SEGN), v * 3 + 3); uu[v] = k / SEGN; uu[v + 1] = (k + 1) / SEGN; bb[v] = bb[v + 1] = birth; }
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('u', new THREE.BufferAttribute(uu, 1)); g.setAttribute('birth', new THREE.BufferAttribute(bb, 1));
    M.arcs = new THREE.LineSegments(g, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: { t: { value: 0 }, alpha: { value: .22 }, dur: { value: .9 } },
      vertexShader: `attribute float u, birth; uniform float t, dur; varying float vV; void main(){ vV = (t - birth) / dur - u; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
      fragmentShader: `uniform float alpha; varying float vV; void main(){ if (vV < 0.0) discard; gl_FragColor = vec4(vec3(.08), alpha * (.35 + .65 * smoothstep(0.0, .08, vV))); }`
    }));
    M.arcs.frustumCulled = false; scene.add(M.arcs); }

  // F. output: the answer comes back as text-token ids
  { const ids = meta.caption.map(String), cv = document.createElement('canvas'); cv.width = 2048; cv.height = 64 * Math.ceil(ids.length / 12);
    const g2 = cv.getContext('2d'); g2.fillStyle = '#fff'; g2.fillRect(0, 0, cv.width, cv.height); g2.font = `34px ${MONO}`; g2.fillStyle = '#141414'; g2.textAlign = 'center'; g2.textBaseline = 'middle';
    const rects = ids.map((s, n) => { const x = (n % 12) * 160, y = Math.floor(n / 12) * 64; g2.fillText(s, x + 80, y + 33); return [x / cv.width, 1 - (y + 64) / cv.height, 160 / cv.width, 64 / cv.height]; });
    const tex = new THREE.CanvasTexture(cv);
    const g0 = new THREE.PlaneGeometry(1.5, .6), g = new THREE.InstancedBufferGeometry(); g.index = g0.index;
    g.setAttribute('position', g0.attributes.position); g.setAttribute('uv', g0.attributes.uv);
    const uvr = new Float32Array(ids.length * 4); rects.forEach((r, n) => uvr.set(r, n * 4));
    g.setAttribute('uvr', new THREE.InstancedBufferAttribute(uvr, 4));
    g.setAttribute('off', new THREE.InstancedBufferAttribute(new Float32Array(ids.length * 3), 3));
    g.setAttribute('a', new THREE.InstancedBufferAttribute(new Float32Array(ids.length), 1));
    g.instanceCount = ids.length;
    M.out = new THREE.Mesh(g, new THREE.ShaderMaterial({
      transparent: true, depthWrite: false, uniforms: { map: { value: tex } },
      vertexShader: `attribute vec4 uvr; attribute vec3 off; attribute float a; varying vec2 vUv; varying float vA;
        void main(){ vUv = uvr.xy + uv * uvr.zw; vA = a; vec4 mv = modelViewMatrix * vec4(off, 1.0); mv.xy += position.xy; gl_Position = projectionMatrix * mv; }`,
      fragmentShader: `uniform sampler2D map; varying vec2 vUv; varying float vA; void main(){ float ink = 1.0 - texture2D(map, vUv).r; float al = ink * vA; if (al < .01) discard; gl_FragColor = vec4(vec3(.08), al); }`
    }));
    M.out.frustumCulled = false; scene.add(M.out); M.nOut = ids.length; }
  return true;
}

function camAt(t) { const a = -.42 + .84 * t / END; cam.position.set(Math.sin(a) * 27, 1.6, Math.cos(a) * 27); cam.lookAt(0, .3, 0); }

function draw(t) {
  camAt(t);
  const si = stageIndex(t);
  // 1 decode, 2 shrink + pad
  M.plane.material.uniforms.t.value = t;
  const shrink = ease(seg(t, TS[2], TS[2] + 1.4));
  const s = lerp(1, SQ / IW, shrink); M.plane.scale.set(s, s, 1);
  M.pad.material.opacity = ease(seg(t, TS[2] + 1.1, TS[2] + 1.6));
  const handoff = t >= TS[2] + 1.6;   // from here the 576 patches carry the picture
  M.plane.visible = !handoff && t < TS[3]; M.pad.visible = M.pad.material.opacity > 0 && !handoff;

  const g = M.tiles.geometry.attributes;
  const pa = M.pts.geometry.attributes;
  for (let i = 0; i < NP; i++) {
    const [x, y] = tileXY(i), [hx, hy, hz, ha] = helix(i);
    const lo = sw(i, NP, 2, t, 1.2, .25) * (t >= TS[2] + 1.7 ? 1 : 0);            // pixelate to 336 × 336
    const lift = sw(i, NP, 3, t, 2.2, .8);                                          // 3 cut: tiles separate
    const fl = sw(i, NP, 4, t, 2.8, 1.1);                                           // 4 flatten into the sequence
    const em = sw(i, NP, 5, t, 2.6, 1.0);                                           // 5 strip → point in the cloud
    const fg = sw(i, NP, 8, t, 1.2, .5);                                            // 8 forget
    const gap = 1 - .16 * lift;
    const zx = x * (1 + .07 * lift), zy = y * (1 + .07 * lift), zz = lift * (.25 + rnd(i, 11) * .9);
    g.off.array.set([lerp(zx, hx, fl), lerp(zy, hy, fl), lerp(zz, hz, fl)], i * 3);
    g.sc.array.set([TILE * gap * lerp(1, .22, fl), TILE * gap * lerp(1, 4.2, fl)], i * 2);
    g.rot.array[i] = ha * fl; g.lo.array[i] = lo; g.strip.array[i] = ease(clamp(fl * 1.6 - .3, 0, 1));
    g.a.array[i] = (handoff ? 1 : 0) * (1 - em);
    pa.position.array.set([lerp(hx, M.CL[i * 3], em), lerp(hy, M.CL[i * 3 + 1], em), lerp(hz, M.CL[i * 3 + 2], em)], i * 3);
    pa.a.array[i] = (em > 0 ? 1 : 0) * (1 - fg) * .95;
  }
  for (const k of ['off', 'sc', 'rot', 'lo', 'strip', 'a']) g[k].needsUpdate = true;
  pa.position.needsUpdate = pa.a.needsUpdate = true;
  M.tiles.visible = handoff && t < TS[5] + 4;
  M.cuts.material.uniforms.t.value = t; M.cuts.material.uniforms.alpha.value = 1 - seg(t, TS[3] + 2.4, TS[3] + 3.4);
  M.cuts.visible = t >= TS[3] && t < TS[3] + 3.5;
  M.pts.visible = t >= TS[5];
  M.arcs.material.uniforms.t.value = t; M.arcs.material.uniforms.alpha.value = .22 * (1 - seg(t, TS[8], TS[8] + 1.4));
  M.arcs.visible = t >= TS[6];
  // 7 output ids rise from the cloud and line up
  const oa = M.out.geometry.attributes, n = M.nOut, hop = 2.6 / n;
  for (let q = 0; q < n; q++) {
    const b0 = TS[7] + .2 + q * hop, f = ease(seg(t, b0, b0 + .9));
    const tx = -9 + (q % 10) * 2.0, ty = 6.4 - Math.floor(q / 10) * .9;
    oa.off.array.set([lerp(0, tx, f), lerp(.5, ty, f), lerp(0, 2, f)], q * 3);
    oa.a.array[q] = (t >= b0 ? 1 : 0) * (1 - sw(q, n, 8, t, 1.2, .5));
  }
  oa.off.needsUpdate = oa.a.needsUpdate = true; M.out.visible = t >= TS[7];

  renderer.render(scene, cam);
  octx.fillStyle = '#fff'; octx.fillRect(0, 0, W, H); octx.drawImage(glc, 0, 0);
  const reached = (k, swl) => Math.floor(clamp((t - TS[k]) / swl, 0, 1) * NP);
  let c = '';
  if (si === 1) c = `${Math.floor(clamp((t - TS[1]) / 3.6, 0, 1) * META.bytes).toLocaleString()} bytes`;
  else if (si === 2) c = t < TS[2] + 1.4 ? `${META.W} × ${META.H}` : '336 × 336';
  else if (si === 3) c = `${reached(3, 2.2)} patches`;
  else if (si === 4) c = `${reached(4, 2.8)} × 588`;
  else if (si === 5) c = `${reached(5, 2.6)} × 1024`;
  else if (si === 6) { let k = 0; for (const b of M.arcBirth) if (t >= b) k++; c = `i ↔ j  ${k}`; }
  else if (si === 7) c = `output ${Math.max(0, Math.min(n, Math.floor((t - TS[7] - .2) / hop) + 1))}`;
  else c = 'Δ weights = 0';
  const al = seg(t, .1, .8) * (1 - seg(t, END - 1, END - .2));
  octx.font = `20px ${MONO}`; octx.fillStyle = `rgba(150,150,150,${al})`; octx.textBaseline = 'alphabetic';
  octx.textAlign = 'right'; octx.fillText(c, W - 80, 70);
  octx.textAlign = 'left'; octx.fillText(String(si).padStart(2, '0'), 80, 70);
}
</script>
