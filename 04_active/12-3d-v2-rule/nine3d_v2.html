<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}#gl{position:absolute;left:-99999px}</style>
<script src="../../node_modules/three/build/three.min.js"></script>
</head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<canvas id="gl" width="1920" height="1080"></canvas>
<script>
/*
  One rule, applied nine times.
  The same 5,366 elements (one per token) pass through every stage. Each transition is a sweep in reading order:
  element i begins its change at  T0 + (i / N) * SWEEP  and completes it DUR seconds later, always with the same easing.
  The camera never changes its motion: one constant-speed orbit for the whole piece.
*/
const W = 1920, H = 1080, VOCAB = 199998;
const MONO = '"DejaVu Sans Mono"', CJK = '"Noto Sans CJK TC"';
let END = 60;
// transition start times; stage k is shown from TS[k] to TS[k+1]
let TS = [null, 0.4, 6, 12, 18, 24, 38, 44, 50, 55];
let SWEEP = 3, DUR = 1, ARCSWEEP = 11.5;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const seg = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
const ease = x => x * x * (3 - 2 * x);
const lerp = (a, b, f) => a + (b - a) * f;
function rnd(i, k = 0) { let x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }
function stageIndex(t) { for (let k = 9; k >= 1; k--) if (t >= TS[k]) return k; return 1; }
// the rule
function sw(i, n, k, t) { const s = TS[k] + (i / n) * SWEEP; return ease(seg(t, s, s + DUR)); }

let T, N, LINKS;
const out = document.getElementById('c'), octx = out.getContext('2d');
const glc = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({ canvas: glc, antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H, false); renderer.setClearColor(0xffffff, 1);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(35, W / H, .1, 400);
const FOGN = 50, FOGF = 120;

// ---------------- layout ----------------
const GC = 74, GR = Math.ceil(5366 / 74), CW = .44, CH = .46;
const FX0 = -GC * CW / 2, FZ0 = -GR * CH / 2;
const FY = 3, TY = 2.5;
function gridPos(i) { return [FX0 + (i % GC + .5) * CW, FY, -FZ0 - (Math.floor(i / GC) + .5) * CH]; }
const TR = 110, TC = 260, TW = 36, TD = 26;
function idRC(id) { const f = Math.floor(id / VOCAB * TR * TC); return [Math.floor(f / TC), f % TC]; }
function terXZ(r, c) { return [-TW / 2 + c / (TC - 1) * TW, -TD / 2 + r / (TR - 1) * TD]; }
const CC = [0, 8.5, 0];   // centre of the cloud

// ---------------- atlas ----------------
const hex = tok => tok.bytes.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
function label(tok) { if (tok.str === null) return hex(tok); return tok.str.replace(/\n/g, '↵').replace(/ /g, '·'); }
function makeAtlas(keys, font, cw, ch, colorOf) {
  const cols = Math.floor(4096 / cw), rows = Math.ceil(keys.length / cols);
  const cv = document.createElement('canvas'); cv.width = 4096; cv.height = Math.min(4096, rows * ch);
  const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  const map = new Map();
  keys.forEach((k, n) => {
    const x = (n % cols) * cw, y = Math.floor(n / cols) * ch;
    let fs = parseInt(font); g.font = font;
    while (g.measureText(k).width > cw - 8 && fs > 9) { fs--; g.font = font.replace(/^\d+/, fs); }
    g.fillStyle = colorOf ? colorOf(k) : '#141414';
    g.fillText(k, x + cw / 2, y + ch / 2 + 1);
    map.set(k, [x / cv.width, 1 - (y + ch) / cv.height, cw / cv.width, ch / cv.height]);
  });
  const tex = new THREE.CanvasTexture(cv); tex.anisotropy = 8; tex.minFilter = THREE.LinearMipmapLinearFilter;
  return { tex, map };
}

// ---------------- materials ----------------
function chipMat(tex, billboard) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { map: { value: tex } },
    vertexShader: `
      attribute vec3 off; attribute vec4 uvr; attribute float a; attribute float sc;
      varying vec2 vUv; varying float vA; varying float vD;
      void main(){
        vUv = uvr.xy + uv * uvr.zw; vA = a;
        ${billboard
          ? `vec4 mv = modelViewMatrix * vec4(off, 1.0); mv.xy += position.xy * sc;`
          : `vec4 mv = modelViewMatrix * vec4(vec3(position.x * sc, 0.0, -position.y * sc) + off, 1.0);`}
        vD = -mv.z; gl_Position = projectionMatrix * mv;
      }`,
    fragmentShader: `
      uniform sampler2D map; varying vec2 vUv; varying float vA; varying float vD;
      void main(){
        float ink = 1.0 - texture2D(map, vUv).r;
        float al = ink * vA * (1.0 - smoothstep(${FOGN}.0, ${FOGF}.0, vD)); if (al < .01) discard;
        gl_FragColor = vec4(vec3(.08), al);
      }`
  });
}
function ptMat(size) {
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false,
    uniforms: { size: { value: size }, alpha: { value: 1 } },
    vertexShader: `
      attribute float a; uniform float size; varying float vA;
      void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vA = a;
        gl_PointSize = size * (40.0 / -mv.z); gl_Position = projectionMatrix * mv; }`,
    fragmentShader: `
      uniform float alpha; varying float vA;
      void main(){ float r = length(gl_PointCoord - .5); if (r > .5) discard;
        float al = smoothstep(.5, .3, r) * alpha * vA; if (al < .01) discard; gl_FragColor = vec4(vec3(.08), al); }`
  });
}
function lineMatA() {   // per-vertex alpha
  return new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, uniforms: { alpha: { value: 1 } },
    vertexShader: `attribute float a; varying float vA; void main(){ vA = a; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
    fragmentShader: `uniform float alpha; varying float vA; void main(){ float al = alpha * vA; if (al < .005) discard; gl_FragColor = vec4(vec3(.08), al); }`
  });
}
const arcMat = new THREE.ShaderMaterial({
  transparent: true, depthWrite: false,
  uniforms: { t: { value: 0 }, alpha: { value: .2 }, dur: { value: 1 } },
  vertexShader: `
    attribute float u; attribute float birth; attribute float death; uniform float t; uniform float dur;
    varying float vV; varying float vK;
    void main(){ vV = (t - birth) / dur - u; vK = 1.0 - smoothstep(death, death + dur, t);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: `
    uniform float alpha; varying float vV; varying float vK;
    void main(){ if (vV < 0.0 || vK <= 0.0) discard; gl_FragColor = vec4(vec3(.08), alpha * vK * (.35 + .65 * smoothstep(0.0, .08, vV))); }`
});

// ---------------- objects ----------------
let M = {}, GRIDP, CLOUD, SLOT, OUTSEQ, BYTEC;
function embedPos(id, i) {
  // illustrative: the same token id always lands on the same point
  const k = Math.floor(rnd(id, 1) * 11);
  const th = rnd(k, 2) * Math.PI * 2, ph = Math.acos(2 * rnd(k, 3) - 1), R = 9;
  const g = s => (rnd(id, s) + rnd(id, s + 1) + rnd(id, s + 2) - 1.5) * 3.2;
  const j = (rnd(i, 13) - .5) * .05;
  return [R * Math.sin(ph) * Math.cos(th) + g(4) + j, CC[1] + R * Math.cos(ph) + g(7) + j, R * Math.sin(ph) * Math.sin(th) + g(10) + j];
}
function chipMesh(A, keyOf, n, w, h, billboard) {
  const base = new THREE.PlaneGeometry(w, h);
  const g = new THREE.InstancedBufferGeometry(); g.index = base.index;
  g.setAttribute('position', base.attributes.position); g.setAttribute('uv', base.attributes.uv);
  const uvr = new Float32Array(n * 4); for (let q = 0; q < n; q++) uvr.set(A.map.get(keyOf(q)), q * 4);
  g.setAttribute('off', new THREE.InstancedBufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('uvr', new THREE.InstancedBufferAttribute(uvr, 4));
  g.setAttribute('a', new THREE.InstancedBufferAttribute(new Float32Array(n), 1));
  g.setAttribute('sc', new THREE.InstancedBufferAttribute(new Float32Array(n).fill(1), 1));
  g.instanceCount = n;
  const m = new THREE.Mesh(g, chipMat(A.tex, billboard)); m.frustumCulled = false; scene.add(m); return m;
}
function pointsObj(n, size) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(n * 3), 3));
  g.setAttribute('a', new THREE.BufferAttribute(new Float32Array(n), 1));
  const p = new THREE.Points(g, ptMat(size)); p.frustumCulled = false; scene.add(p); return p;
}

function setData(d, links) {
  T = d; N = T.length; LINKS = links;
  BYTEC = []; let b = 0; for (const t of T) { b += t.bytes.length; BYTEC.push(b); }
  const A0 = makeAtlas([...new Set(T.map(hex))], `30px ${MONO}`, 160, 64);
  const A1 = makeAtlas([...new Set(T.map(label))], `36px ${CJK}`, 160, 64, k => /^[0-9A-F]{2}( [0-9A-F]{2})*$/.test(k) ? '#8a8a8a' : '#141414');
  const A2 = makeAtlas([...new Set(T.map(t => String(t.id)))], `32px ${MONO}`, 160, 64);
  M.hex = chipMesh(A0, q => hex(T[q]), N, .42, .168);
  M.txt = chipMesh(A1, q => label(T[q]), N, .42, .168);
  M.ids = chipMesh(A2, q => String(T[q].id), N, .42, .168);

  { const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(N * 6), 3));
    g.setAttribute('a', new THREE.BufferAttribute(new Float32Array(N * 2), 1));
    M.cols = new THREE.LineSegments(g, lineMatA()); M.cols.frustumCulled = false; scene.add(M.cols); }

  GRIDP = new Float32Array(N * 3); CLOUD = new Float32Array(N * 3);
  for (let i = 0; i < N; i++) { GRIDP.set(gridPos(i), i * 3); CLOUD.set(embedPos(T[i].id, i), i * 3); }
  M.cloud = pointsObj(N, 2.6);

  // attention: causal pairs, born in reading order of the later token
  const pairs = [];
  for (const L of LINKS) for (const q of L.q) for (const tg of L.targets) for (const j of tg) if (j < q) pairs.push([q, j]);
  const byId = new Map(); T.forEach((t, i) => { if (!byId.has(t.id)) byId.set(t.id, []); byId.get(t.id).push(i); });
  let s = 0;
  while (pairs.length < 1600) {
    s++;
    const i = 20 + Math.floor(rnd(s, 21) * (N - 20)), same = byId.get(T[i].id);
    let j;
    if (rnd(s, 22) < .35 && same.length > 1) j = same[Math.floor(rnd(s, 23) * same.length)];
    else if (rnd(s, 24) < .5) j = i - 1 - Math.floor(rnd(s, 25) * 40);
    else j = Math.floor(rnd(s, 26) * i);
    if (j < 0 || j >= i || (T[i].str !== null && T[i].str.trim() === '')) continue;
    pairs.push([i, j]);
  }
  const SEGN = 22, n = pairs.length;
  const pos = new Float32Array(n * SEGN * 6), uu = new Float32Array(n * SEGN * 2), bb = new Float32Array(n * SEGN * 2), dd = new Float32Array(n * SEGN * 2);
  const C = new THREE.Vector3(...CC);
  M.arcN = n; M.arcBirth = [];
  pairs.forEach(([i, j], q) => {
    const A = new THREE.Vector3(...CLOUD.slice(j * 3, j * 3 + 3)), B = new THREE.Vector3(...CLOUD.slice(i * 3, i * 3 + 3));
    const Mid = A.clone().add(B).multiplyScalar(.5), o = Mid.clone().sub(C);
    if (o.length() < .01) o.set(0, 1, 0);
    o.normalize().multiplyScalar(A.distanceTo(B) * (.35 + .3 * rnd(q, 30)) + .4);
    const P = Mid.add(o);
    const birth = TS[5] + .4 + (i / N) * ARCSWEEP, death = TS[6] + (i / N) * SWEEP;
    M.arcBirth.push(birth);
    const pt = u => { const a = (1 - u) ** 2, b2 = 2 * u * (1 - u), c = u * u; return [A.x * a + P.x * b2 + B.x * c, A.y * a + P.y * b2 + B.y * c, A.z * a + P.z * b2 + B.z * c]; };
    for (let k = 0; k < SEGN; k++) {
      const u0 = k / SEGN, u1 = (k + 1) / SEGN, v = (q * SEGN + k) * 2;
      pos.set(pt(u0), v * 3); pos.set(pt(u1), v * 3 + 3);
      uu[v] = u0; uu[v + 1] = u1; bb[v] = bb[v + 1] = birth; dd[v] = dd[v + 1] = death;
    }
  });
  { const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('u', new THREE.BufferAttribute(uu, 1));
    g.setAttribute('birth', new THREE.BufferAttribute(bb, 1)); g.setAttribute('death', new THREE.BufferAttribute(dd, 1));
    M.arcs = new THREE.LineSegments(g, arcMat); M.arcs.frustumCulled = false; scene.add(M.arcs); }

  // cache: every element splits into 8 copies, one per layer
  SLOT = new Float32Array(N * 2);
  for (let i = 0; i < N; i++) { SLOT[i * 2] = (i % 74 - 36.5) * .4; SLOT[i * 2 + 1] = (Math.floor(i / 74) - 36) * .4; }
  M.cache = pointsObj(8 * N, 1.5);

  // vocabulary field
  { const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(TR * (TC - 1) * 6), 3));
    g.setAttribute('a', new THREE.BufferAttribute(new Float32Array(TR * (TC - 1) * 2), 1));
    M.ter = new THREE.LineSegments(g, lineMatA()); M.ter.frustumCulled = false; scene.add(M.ter); }

  // output ids: billboards on a ring above the field
  OUTSEQ = []; for (let k = N - 24; k < N; k++) OUTSEQ.push(k);
  M.out = chipMesh(A2, q => String(T[OUTSEQ[q]].id), OUTSEQ.length, 1.3, .52, true);
}

// ---------------- camera: one constant orbit ----------------
const ORB = { r: 48, h: 21, ty: 6.5, a0: -0.35, turn: Math.PI };
function camAt(t) {
  const a = ORB.a0 + ORB.turn * t / END;
  cam.position.set(Math.sin(a) * ORB.r, ORB.h, Math.cos(a) * ORB.r);
  cam.lookAt(0, ORB.ty, 0);
}

// ---------------- field heights ----------------
function fieldState(t) {
  const hop = .2, t0 = TS[8] + .3;
  const nOut = clamp(Math.floor((t - t0) / hop), -1, OUTSEQ.length - 1);
  const pid = T[OUTSEQ[Math.max(0, nOut)]].id, [pr, pc] = idRC(pid);
  const peak = 7 * ease(seg(t, TS[7] + SWEEP + DUR, TS[7] + SWEEP + DUR + 1.2));
  const hopF = nOut >= 0 ? ease(seg(t - t0 - nOut * hop, 0, .12)) : 1;
  return { nOut, pr, pc, peak, hopF, t0, hop };
}
function height(r, c, F) {
  const d2 = (r - F.pr) ** 2 + (c - F.pc) ** 2 * .35;
  let y = .05 * rnd(r * TC + c, 50) + F.peak * F.hopF * Math.exp(-d2 / 2.2);
  const k = F.peak / 7;
  y += .9 * k * Math.exp(-((r - 31) ** 2 + (c - 190) ** 2 * .35) / 3) * rnd(F.nOut + 3, 51);
  y += .6 * k * Math.exp(-((r - 80) ** 2 + (c - 60) ** 2 * .35) / 3) * rnd(F.nOut + 3, 52);
  return y;
}

// ---------------- frame ----------------
function draw(t) {
  camAt(t);
  const si = stageIndex(t);
  const F = fieldState(t);
  const hx = M.hex.geometry.attributes, tx = M.txt.geometry.attributes, ix = M.ids.geometry.attributes;
  const cl = M.cols.geometry.attributes, cd = M.cloud.geometry.attributes, kc = M.cache.geometry.attributes;
  for (let i = 0; i < N; i++) {
    const s1 = sw(i, N, 1, t), s2 = sw(i, N, 2, t), s3 = sw(i, N, 3, t), s4 = sw(i, N, 4, t),
          s6 = sw(i, N, 6, t), s7 = sw(i, N, 7, t), s9 = sw(i, N, 9, t);
    const gx = GRIDP[i * 3], gz = GRIDP[i * 3 + 2];
    const hh = .25 + T[i].id / VOCAB * 9;
    // 1 appear (hex)   2 hex → text   3 text → id, rise   4 → point in the cloud
    const ap = s1 < 1 && s1 > 0 ? (rnd(i, Math.floor(t * 20)) < .5 ? .3 : 1) * s1 : s1;
    const half = (s, lo) => lo ? clamp(1 - s * 2, 0, 1) : clamp(s * 2 - 1, 0, 1);
    const y = hh * s3 * (1 - s4);
    hx.a.array[i] = ap * half(s2, true);
    tx.a.array[i] = half(s2, false) * half(s3, true);
    ix.a.array[i] = half(s3, false) * (1 - s4);
    for (const at of [hx, tx, ix]) { at.off.array[i * 3] = gx; at.off.array[i * 3 + 1] = FY + y + .002; at.off.array[i * 3 + 2] = gz; }
    // column: grows with the number, shrinks as the number leaves
    cl.position.array.set([gx, FY, gz, gx, FY + y, gz], i * 6);
    cl.a.array[i * 2] = cl.a.array[i * 2 + 1] = .3 * s3 * (1 - s4);
    // point: column top → cloud
    const cx = CLOUD[i * 3], cy = CLOUD[i * 3 + 1], cz = CLOUD[i * 3 + 2];
    cd.position.array[i * 3] = lerp(gx, cx, s4); cd.position.array[i * 3 + 1] = lerp(FY + hh * s3, cy, s4); cd.position.array[i * 3 + 2] = lerp(gz, cz, s4);
    cd.a.array[i] = .85 * s4 * (s6 > 0 ? 0 : 1);
    // 6 split into eight cache copies   7 copies fall onto the token's place in the vocabulary field   9 fade
    const [rr, rc] = idRC(T[i].id), [fx, fz] = terXZ(rr, rc), fy = TY + height(rr, rc, F);
    for (let l = 0; l < 8; l++) {
      const o = (l * N + i) * 3;
      const lx = SLOT[i * 2], ly = 2.5 + l * 1.4, lz = SLOT[i * 2 + 1];
      kc.position.array[o] = lerp(lerp(cx, lx, s6), fx, s7);
      kc.position.array[o + 1] = lerp(lerp(cy, ly, s6), fy + .03, s7);
      kc.position.array[o + 2] = lerp(lerp(cz, lz, s6), fz, s7);
      kc.a.array[l * N + i] = (s6 > 0 ? 1 : 0) * lerp(.6, .12, s7) * (1 - s9);
    }
  }
  for (const at of [hx, tx, ix]) { at.a.needsUpdate = true; at.off.needsUpdate = true; }
  cl.position.needsUpdate = cl.a.needsUpdate = true; cd.position.needsUpdate = cd.a.needsUpdate = true;
  kc.position.needsUpdate = kc.a.needsUpdate = true;

  // 5 arcs: born in reading order (uniforms only)
  arcMat.uniforms.t.value = t;

  // 7 field rows appear in vocabulary order (the same sweep, over rows); 9 rows flatten and fade in the same order
  const tp = M.ter.geometry.attributes;
  for (let r = 0; r < TR; r++) {
    const a = .3 * sw(r, TR, 7, t) * (1 - sw(r, TR, 9, t)), flat = 1 - sw(r, TR, 9, t);
    for (let c = 0; c < TC - 1; c++) for (let e = 0; e < 2; e++) {
      const cc = c + e, [x, z] = terXZ(r, cc), v = (r * (TC - 1) + c) * 2 + e;
      tp.position.array[v * 3] = x; tp.position.array[v * 3 + 1] = TY + height(r, cc, F) * flat; tp.position.array[v * 3 + 2] = z;
      tp.a.array[v] = a;
    }
  }
  tp.position.needsUpdate = tp.a.needsUpdate = true;

  // 8 output: each id rises from the peak to its place on a ring; 9 they fade in order
  const ox = M.out.geometry.attributes, nO = OUTSEQ.length;
  for (let q = 0; q < nO; q++) {
    const [r, c] = idRC(T[OUTSEQ[q]].id), [sx, sz] = terXZ(r, c);
    const ang = q / nO * Math.PI * 2, tx2 = Math.sin(ang) * 11, tz2 = Math.cos(ang) * 11, ty2 = 12.5;
    const b0 = F.t0 + q * F.hop, f = ease(seg(t, b0, b0 + 1.2));
    ox.off.array[q * 3] = lerp(sx, tx2, f); ox.off.array[q * 3 + 1] = lerp(TY + 7.2, ty2, f); ox.off.array[q * 3 + 2] = lerp(sz, tz2, f);
    ox.a.array[q] = (t >= b0 ? 1 : 0) * (1 - sw(q, nO, 9, t));
  }
  ox.off.needsUpdate = ox.a.needsUpdate = true;

  renderer.render(scene, cam);
  octx.fillStyle = '#fff'; octx.fillRect(0, 0, W, H);
  octx.drawImage(glc, 0, 0);

  // counter: counts what the sweep has reached
  const reached = k => { let n = Math.floor(clamp((t - TS[k]) / SWEEP, 0, 1) * N); return n; };
  let s = '';
  if (si === 1) { const n = reached(1); s = `${(n ? BYTEC[n - 1] : 0).toLocaleString()} bytes`; }
  else if (si === 2 || si === 3) s = `${reached(si).toLocaleString()} tokens`;
  else if (si === 4) s = `${reached(4).toLocaleString()} × d`;
  else if (si === 5) { let n = 0; for (const b of M.arcBirth) if (t >= b) n++; s = `i → j  ${n.toLocaleString()}`; }
  else if (si === 6) s = `cache ${(reached(6) * 8).toLocaleString()}`;
  else if (si === 7) s = `p( · )  ${VOCAB.toLocaleString()}`;
  else if (si === 8) s = `output ${Math.max(0, F.nOut + 1)}`;
  else s = 'Δ weights = 0';
  const a = seg(t, .2, 1) * (1 - seg(t, END - 1.5, END - .3));
  octx.font = `20px ${MONO}`; octx.fillStyle = `rgba(150,150,150,${a})`; octx.textBaseline = 'alphabetic';
  octx.textAlign = 'right'; octx.fillText(s, W - 80, 70);
  octx.textAlign = 'left'; octx.fillText(String(si).padStart(2, '0'), 80, 70);
}
</script>
</body></html>
