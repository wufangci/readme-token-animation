<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const MONO = '"DejaVu Sans Mono"';
const INK = '20,20,20', DIM = '150,150,150';
const rgba = (c, a) => `rgba(${c},${a})`;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => ease((t - a) / (b - a));
const win = (t, a, b, fi = .6, fo = .6) => seg(t, a, a + fi) * (1 - seg(t, b - fo, b));
const rnd = (i, k) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
const hex = b => b.toString(16).toUpperCase().padStart(2, '0');

let T = [], BYTES = [], BTOK = [], N = 0, NB = 0;
const VOCAB = 199998;
function setData(d) {
  T = d; N = T.length;
  T.forEach((t, i) => t.bytes.forEach(b => { BYTES.push(b); BTOK.push(i); }));
  NB = BYTES.length;
}

// ---------------- timeline ----------------
const S = { b: [0.4, 5.4], s: [5.4, 10.4], i: [10.4, 15.6], v: [15.6, 20.4], a: [20.4, 39.0], c: [39.0, 42.6], p: [42.6, 45.6], o: [45.6, 53.0], f: [53.0, 60.0] };
const LAY_END = 27.6;   // matrix layers until here, then the points become lines
const LN_A = 28.6, LN_B = 38.0;
const STAGE = ['b', 's', 'i', 'v', 'a', 'c', 'p', 'o', 'f'];

// ---------------- byte window (stages 1–3) ----------------
const BX = 80, BY = 120, BC = 64, BCW = 27.5, BRH = 19.5, BROWS = 45, BWIN = BC * BROWS;
function bpos(k) { return { x: BX + (k % BC) * BCW, y: BY + Math.floor(k / BC) * BRH }; }

function drawBytes(t) {
  const on = win(t, S.b[0], S.i[1] - .2, .3, 1.2);
  if (on <= 0) return;
  const shown = clamp((t - S.b[0]) / 3.8, 0, 1) * BWIN;
  const split = seg(t, S.s[0] + .2, S.s[1] - .8);         // boxes appear as a wave
  const toId = seg(t, S.i[0], S.i[0] + 1.8);                // hex -> id
  ctx.textBaseline = 'middle';
  // hex text
  ctx.font = `11px ${MONO}`; ctx.textAlign = 'left';
  for (let k = 0; k < Math.min(shown, BWIN); k++) {
    const p = bpos(k);
    const fresh = clamp(shown - k, 0, 1);
    ctx.fillStyle = rgba(INK, on * fresh * (1 - toId) * .85);
    ctx.fillText(hex(BYTES[k]), p.x + 4, p.y + BRH / 2);
  }
  // token boxes: one box per token inside the window, split across rows if needed
  if (split > 0) {
    let k = 0;
    while (k < BWIN) {
      const ti = BTOK[k]; let e = k; while (e < BWIN && BTOK[e] === ti) e++;
      const wave = clamp(split * 1.25 - k / BWIN * .25, 0, 1);
      if (wave > 0) {
        // draw per row segment
        let a = k;
        while (a < e) {
          const rowEnd = Math.min(e, (Math.floor(a / BC) + 1) * BC);
          const p = bpos(a), w = (rowEnd - a) * BCW;
          ctx.strokeStyle = rgba(INK, on * wave * .45 * (1 - toId * .3)); ctx.lineWidth = 1;
          ctx.strokeRect(p.x + 1, p.y + 1.5, w - 2, BRH - 3);
          if (ti % 2 === 0) { ctx.fillStyle = rgba(INK, on * wave * .05); ctx.fillRect(p.x + 1, p.y + 1.5, w - 2, BRH - 3); }
          a = rowEnd;
        }
        // id, centred on the token's first row segment
        if (toId > 0) {
          const rowEnd = Math.min(e, (Math.floor(k / BC) + 1) * BC);
          const p = bpos(k), w = (rowEnd - k) * BCW;
          ctx.font = `9px ${MONO}`; ctx.textAlign = 'center';
          ctx.fillStyle = rgba(INK, on * toId);
          ctx.fillText(String(T[ti].id), p.x + w / 2, p.y + BRH / 2);
          ctx.textAlign = 'left'; ctx.font = `11px ${MONO}`;
        }
      }
      k = e;
    }
  }
}

// ---------------- full id grid (end of stage 3) ----------------
const GX = 80, GY = 110, GW = 1760, GH = 860, GC = 64;
let GR, GCW, GRH;
function gpos(i) { return { x: GX + (i % GC) * GCW + GCW / 2, y: GY + Math.floor(i / GC) * GRH + GRH / 2 }; }
function drawIdGrid(t) {
  const on = win(t, S.i[0] + 2.2, S.v[0] + 1.0, 1.0, 1.0);
  if (on <= 0) return;
  ctx.font = `8px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < N; i++) {
    const p = gpos(i);
    const tw = Math.pow(rnd(i, Math.floor(t * (1 + rnd(i, 3) * 2) + rnd(i, 4) * 9)), 2);
    ctx.fillStyle = rgba(INK, on * (.15 + .7 * tw));
    ctx.fillText(String(T[i].id), p.x, p.y);
  }
}

// ---------------- matrices ----------------
const MW = 1760, MH = 300;           // embedding: tokens across, dims down
let EMB = [], ATT = [], CACHE = null, WEIGHTS = null, PUNCT = null;
const NL = 8;                         // layers shown
function gauss(a, b) { return Math.sqrt(-2 * Math.log(a + 1e-9)) * Math.cos(6.2831853 * b); }
function makeEmb(layer) {
  const cv = document.createElement('canvas'); cv.width = MW; cv.height = MH;
  const c = cv.getContext('2d'), im = c.createImageData(MW, MH);
  for (let x = 0; x < MW; x++) {
    const ti = Math.floor(x * N / MW), id = T[ti].id;
    for (let y = 0; y < MH; y++) {
      // same id -> same base vector; position adds a slow wave; deeper layers mix in context
      let v = gauss(rnd(id, y * 3 + 1), rnd(id, y * 3 + 2)) * .5;
      v += .25 * Math.sin(ti / Math.pow(40, (y % 64) / 64) + y);
      if (layer > 0) v = v * (1 - layer * .08) + gauss(rnd(ti * 7 + layer, y), rnd(ti * 5 + layer, y + 9)) * layer * .06 + .35 * Math.sin(ti / 180 + y * .3 + layer);
      const g = clamp(.5 + v * .35, 0, 1);
      const o = (y * MW + x) * 4, val = Math.round(255 - g * 200);
      im.data[o] = im.data[o + 1] = im.data[o + 2] = val; im.data[o + 3] = 255;
    }
  }
  c.putImageData(im, 0, 0); return cv;
}
const AS = 600;                       // attention matrix size on screen
function makeAtt(layer) {
  const cv = document.createElement('canvas'); cv.width = AS; cv.height = AS;
  const c = cv.getContext('2d'), im = c.createImageData(AS, AS);
  const band = [3, 12, 40, 6, 120, 20, 2, 60][layer];
  const sink = [.9, .5, .8, .3, .95, .6, .7, .85][layer];
  const pun = [.2, .6, .1, .8, .3, .5, .15, .4][layer];
  for (let r = 0; r < AS; r++) {
    const i = Math.floor((r + .5) * N / AS);
    for (let cc = 0; cc < AS; cc++) {
      const o = (r * AS + cc) * 4;
      if (cc > r) { im.data[o] = im.data[o + 1] = im.data[o + 2] = 255; im.data[o + 3] = 255; continue; }   // cannot look forward
      const j = Math.floor((cc + .5) * N / AS);
      let v = Math.exp(-(i - j) / (band * N / AS / 2));
      if (cc < 6) v = Math.max(v, sink * (1 - cc / 8));
      if (PUNCT[j] && rnd(j, layer + 20) < .55) v = Math.max(v, pun * (.55 + .45 * rnd(j, layer)) * (.6 + .4 * rnd(r >> 3, j)));
      v = Math.max(v, .22 * Math.pow(rnd(r * 1000 + cc, layer), 3) + .05);
      const g = clamp(v, 0, 1), val = Math.round(255 - g * 215);
      im.data[o] = im.data[o + 1] = im.data[o + 2] = val; im.data[o + 3] = 255;
    }
  }
  c.putImageData(im, 0, 0); return cv;
}
function makeStatic(w, h, seed, contrast) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const c = cv.getContext('2d'), im = c.createImageData(w, h);
  for (let k = 0; k < w * h; k++) { const v = Math.round(255 - rnd(k, seed) * contrast); im.data[k * 4] = im.data[k * 4 + 1] = im.data[k * 4 + 2] = v; im.data[k * 4 + 3] = 255; }
  c.putImageData(im, 0, 0); return cv;
}

function drawVectors(t) {
  const on = win(t, S.v[0] + .5, LAY_END + .8, .8, .8);
  if (on <= 0) return;
  // during stage 5 the matrix moves up and changes with each layer
  const up = seg(t, S.a[0], S.a[0] + 1.2);
  const layer = Math.max(0, Math.min(NL - 1, Math.floor((t - S.a[0] - 1.2) / 1.0)));
  const y = 260 * (1 - up) + 110 * up, h = MH * (1 - up * .55);
  ctx.globalAlpha = on;
  // reveal left->right quickly the first time (lookup of every id)
  const rev = clamp((t - S.v[0] - .5) / 1.2, 0, 1);
  ctx.drawImage(EMB[layer], 0, 0, MW * rev, MH, 80, y, MW * rev, h);
  ctx.globalAlpha = 1;
}
const TL = { x: 80, y: 330, w: 300, h: 240 };     // where the matrix waits while the lines are drawn
function attRect(t) {
  const m = seg(t, LAY_END, LAY_END + 1.0);
  const x0 = (W - AS) / 2, y0 = 270, w0 = AS, h0 = AS * .8;
  return { x: x0 + (TL.x - x0) * m, y: y0 + (TL.y - y0) * m, w: w0 + (TL.w - w0) * m, h: h0 + (TL.h - h0) * m };
}
function drawAttention(t) {
  const on = win(t, S.a[0] + 1.0, S.c[0] + 1.6, .8, 1.2);
  if (on <= 0) return;
  const layer = Math.min(NL - 1, Math.max(0, Math.floor((t - S.a[0] - 1.2) / 1.0)));
  const fold = seg(t, S.c[0], S.c[0] + 1.4);
  const R = attRect(t);
  ctx.globalAlpha = on;
  if (fold <= 0) ctx.drawImage(ATT[layer], R.x, R.y, R.w, R.h);
  else {
    for (let l = 0; l < NL; l++) {
      const tx = 80 + l * 26, w = R.w * (1 - fold) + 18 * fold;
      const x = R.x * (1 - fold) + tx * fold, y = R.y * (1 - fold) + 270 * fold, h = R.h * (1 - fold) + AS * .8 * fold;
      ctx.globalAlpha = on * (fold < 1 ? 1 / (1 + l * fold) : 1);
      ctx.drawImage(ATT[l], x, y, w, h);
    }
  }
  ctx.globalAlpha = 1;
}

// ---------------- points of the matrix become lines between tokens ----------------
const RX = 470, RY = 110, RW = 1370, RH = 860, RC = 56;
let RR, RCW, RRH, PAIRS = null;
function rpos(i) { return { x: RX + (i % RC) * RCW + RCW / 2, y: RY + Math.floor(i / RC) * RRH + RRH / 2 }; }
function buildPairs() {
  const punct = []; PUNCT.forEach((p, j) => { if (p) punct.push(j); });
  PAIRS = [];
  const M = 3600;
  for (let k = 0; k < M; k++) {
    const i = Math.floor(rnd(k, 41) * (N - 12)) + 12;
    const r = rnd(k, 42); let j;
    if (r < .45) j = Math.max(0, i - 1 - Math.floor(rnd(k, 43) * RC * 2));
    else if (r < .72) { let lo = 0, hi = punct.length; while (lo < hi) { const m = (lo + hi) >> 1; if (punct[m] < i) lo = m + 1; else hi = m; } j = lo ? punct[Math.floor(rnd(k, 44) * lo)] : 0; }
    else if (r < .85) j = Math.floor(rnd(k, 45) * 3);
    else j = Math.floor(rnd(k, 46) * i);
    PAIRS.push({ i, j, w: k < 60 ? .85 : .3 + .7 * Math.pow(rnd(k, 47), 3), side: rnd(k, 48) < .5,
                 st: LN_A + (LN_B - 2.2 - LN_A) * Math.pow(k / M, 1 / 3) });
  }
}
function drawRelGrid(t) {
  const on = win(t, LN_A - .8, S.c[0] + .8, 1.0, 1.0);
  if (on <= 0) return;
  ctx.font = `7px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (let i = 0; i < N; i++) { const p = rpos(i); ctx.fillStyle = rgba(INK, on * (.1 + .08 * rnd(i, 8))); ctx.fillText(String(T[i].id), p.x, p.y); }
}
function curve(a, b, side, prog) {
  const mx = (a.x + b.x) / 2, dy = b.y - a.y;
  const bow = (side ? 1 : -1) * Math.min(240, 30 + Math.abs(dy) * .35);
  const cx = Math.max(RX, Math.min(RX + RW, mx + bow)), cy = (a.y + b.y) / 2;
  ctx.beginPath(); ctx.moveTo(a.x, a.y);
  const st = 24, n = Math.max(1, Math.ceil(st * prog));
  for (let q = 1; q <= n; q++) { const u = Math.min(prog, q / st); ctx.lineTo((1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * cx + u * u * b.x, (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * cy + u * u * b.y); }
  ctx.stroke();
}
function drawLines(t) {
  const on = 1 - seg(t, S.c[0], S.c[0] + 1.2);
  if (on <= 0 || t < LN_A) return;
  const R = attRect(t);
  ctx.lineWidth = 1;
  PAIRS.forEach((P, k) => {
    if (t < P.st) return;
    const fly = clamp((t - P.st) / .7, 0, 1);         // the point leaves the matrix
    const grow = ease((t - P.st - .55) / 1.6);          // and becomes a line between the two tokens
    const a = rpos(P.i), b = rpos(P.j);
    const src = { x: R.x + (P.j + .5) / N * R.w, y: R.y + (P.i + .5) / N * R.h };
    if (fly < 1) {
      const e = ease(fly), sz = k < 60 ? 4 : 2.6;
      if (fly < .35) { ctx.strokeStyle = rgba(INK, on * (1 - fly / .35) * .8); ctx.lineWidth = 1; ctx.strokeRect(src.x - 4, src.y - 4, 8, 8); }
      ctx.fillStyle = rgba(INK, on * (k < 60 ? .95 : .55));
      ctx.fillRect(src.x + (a.x - src.x) * e - sz / 2, src.y + (a.y - src.y) * e - sz / 2, sz, sz);
    }
    if (grow > 0) {
      const head = 1 + .8 * (1 - clamp((t - P.st - .55) / 2.2, 0, 1));
      ctx.strokeStyle = rgba(INK, on * P.w * .2 * head * (k < 60 ? 2.2 : 1));
      curve(a, b, P.side, grow);
    }
  });
}

// ---------------- cache (stages 6–9) ----------------
let OUT = 0;   // tokens written so far (stage 8)
function drawCache(t) {
  const on = win(t, S.c[0] + 1.4, S.f[0] + 3.0, .8, .1);
  if (on <= 0) return;
  const erase = seg(t, S.f[0] + .3, S.f[0] + 3.0);           // stage 9: wiped
  const y0 = 270, hh = AS * .8;
  for (let l = 0; l < NL; l++) {
    const x = 80 + l * 26;
    const keep = clamp(1 - erase * 1.3 + l * .04, 0, 1);
    if (keep <= 0) continue;
    ctx.globalAlpha = on;
    ctx.drawImage(CACHE, 0, 0, 18, 600 * keep, x, y0, 18, hh * keep);
    // grows by one sliver per written token
    if (OUT > 0) { ctx.fillStyle = rgba(INK, on * .8 * keep); ctx.fillRect(x, y0 + hh, 18, Math.min(OUT, 40) * 1.2 * keep); }
  }
  ctx.globalAlpha = 1;
}

// ---------------- probabilities + output (stages 7–8) ----------------
const PX = 80, PW = 1760, PY = 880, PH = 300;
const OUT_TOKS = [];      // the letter itself, from the first token
function distribution(step, t) {
  const target = T[OUT_TOKS[step]].id;
  return { target, alts: [0, 1, 2, 3].map(k => Math.floor(rnd(step * 31 + k, 5) * VOCAB)), conf: .55 + .35 * rnd(step, 9) };
}
function drawProb(t) {
  const on = win(t, S.p[0] + .4, S.f[0] + 2.5, .8, 1.5);
  if (on <= 0) return;
  const step = Math.max(0, Math.floor((t - S.o[0]) / .62));
  const s = Math.min(step, OUT_TOKS.length - 1);
  const d = distribution(s, t);
  const phase = t < S.o[0] ? seg(t, S.p[0] + .8, S.p[1]) : clamp(((t - S.o[0]) % .62) / .35, 0, 1);
  // axis
  ctx.strokeStyle = rgba(DIM, on * .6); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(PX, PY); ctx.lineTo(PX + PW, PY); ctx.stroke();
  // noise floor over every bin
  ctx.strokeStyle = rgba(INK, on * .5);
  ctx.beginPath();
  for (let x = 0; x < PW; x++) {
    const h = 1 + 5 * Math.pow(rnd(x + s * 7, 3), 6);
    ctx.moveTo(PX + x + .5, PY); ctx.lineTo(PX + x + .5, PY - h);
  }
  ctx.stroke();
  // alternatives and the chosen spike
  d.alts.forEach((id, k) => {
    const x = PX + id / VOCAB * PW, h = PH * (1 - d.conf) * (.5 - k * .1) * phase;
    ctx.fillStyle = rgba(INK, on * .45); ctx.fillRect(x, PY - h, 2, h);
  });
  const x = PX + d.target / VOCAB * PW, h = PH * d.conf * phase;
  ctx.fillStyle = rgba(INK, on); ctx.fillRect(x - 1, PY - h, 3, h);
  ctx.font = `14px ${MONO}`; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = rgba(INK, on * phase); ctx.fillText(String(d.target), x, PY - h - 10);
  // axis ends
  ctx.font = `12px ${MONO}`; ctx.fillStyle = rgba(DIM, on);
  ctx.textAlign = 'left'; ctx.fillText('0', PX, PY + 22);
  ctx.textAlign = 'right'; ctx.fillText(String(VOCAB - 1), PX + PW, PY + 22);
}
function drawOutput(t) {
  const on = win(t, S.o[0], S.f[0] + 2.0, .3, 1.5);
  OUT = 0;
  if (on <= 0) return;
  const step = Math.floor((t - S.o[0]) / .62);
  OUT = clamp(step, 0, OUT_TOKS.length);
  ctx.font = `30px ${MONO}`; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  let x = 400, y = 230;
  for (let k = 0; k < OUT; k++) {
    const s = String(T[OUT_TOKS[k]].id);
    const w = ctx.measureText(s + ' ').width;
    if (x + w > W - 80) { x = 400; y += 50; }
    ctx.fillStyle = rgba(INK, on * clamp((t - S.o[0] - k * .62) / .3 - 1, 0, 1));
    ctx.fillText(s, x, y);
    x += w;
  }
}

// ---------------- weights: present from the start, never changed ----------------
function drawWeights(t) {
  const on = seg(t, .2, 1.2) * (1 - seg(t, 58.6, 59.8));
  ctx.globalAlpha = on * .55;
  ctx.drawImage(WEIGHTS, 80, 1010, 1760, 24);
  ctx.globalAlpha = 1;
}

// ---------------- counter ----------------
function counter(t) {
  let s = '', a = 1;
  if (t < S.s[1]) s = `${Math.min(NB, Math.floor(NB * clamp((t - S.b[0]) / 3.8, 0, 1))).toLocaleString()} bytes`;
  else if (t < S.v[0]) s = `${N.toLocaleString()} tokens`;
  else if (t < S.a[0]) s = `${N.toLocaleString()} × d`;
  else if (t < LN_A) s = `layer ${Math.min(NL, Math.max(1, Math.floor((t - S.a[0] - 1.2) / 1.0) + 1))}`;
  else if (t < S.c[0]) s = `i → j  ${PAIRS.filter(P => t >= P.st).length.toLocaleString()}`;
  else if (t < S.p[0]) s = 'cache';
  else if (t < S.o[0]) s = `p( · )  ${VOCAB.toLocaleString()}`;
  else if (t < S.f[0]) s = `output ${OUT}`;
  else if (t < 58.6) s = 'Δ weights = 0';
  else s = '';
  a = seg(t, .2, .8) * (1 - seg(t, 58.6, 59.6));
  ctx.font = `20px ${MONO}`; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = rgba(DIM, a); ctx.fillText(s, W - 80, 70);
  // stage index
  const idx = STAGE.findIndex(k => t >= S[k][0] && t < S[k][1]);
  if (idx >= 0) { ctx.textAlign = 'left'; ctx.fillText(String(idx + 1).padStart(2, '0'), 80, 70); }
}

let READY = false;
function init() {
  GR = Math.ceil(N / GC); GCW = GW / GC; GRH = GH / GR;
  PUNCT = T.map(t => !!(t.str && /[，。：？！「」\n]/.test(t.str)));
  for (let l = 0; l < NL; l++) { EMB.push(makeEmb(l)); ATT.push(makeAtt(l)); }
  CACHE = makeStatic(18, 600, 77, 170);
  WEIGHTS = makeStatic(1760, 24, 5, 120);
  for (let k = 0; k < 40; k++) OUT_TOKS.push(k);
  RR = Math.ceil(N / RC); RCW = RW / RC; RRH = RH / RR; buildPairs();
  READY = true;
}
function draw(t) {
  if (!READY) init();
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  drawBytes(t);
  drawIdGrid(t);
  drawVectors(t);
  drawRelGrid(t);
  drawLines(t);
  drawAttention(t);
  drawOutput(t);
  drawCache(t);
  drawProb(t);
  drawWeights(t);
  counter(t);
}
</script></body></html>
