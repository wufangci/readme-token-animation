<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const W = 1080, H = 1920;
const ctx = document.getElementById('c').getContext('2d');
const SERIF = '"Noto Serif CJK TC"', MONO = '"DejaVu Sans Mono"', SANS = '"Noto Sans CJK TC"';
let INK = '237,234,228', DIM = '140,140,140', ACC = '237,234,228', BG = '#000';
function setTheme(light) { if (light) { INK = '20,20,20'; DIM = '150,150,150'; ACC = '20,20,20'; BG = '#fff'; } }
let T = [];
function setData(d) { T = d; }

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => ease((t - a) / (b - a));
const rnd = (i, k) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
const rgba = (c, a) => `rgba(${c},${a})`;

// ---------- grid of all tokens ----------
const COLS = 36, GX = 60, GY = 230, GW = 960, GH = 1480;
let ROWS, CW, CH;
function cell(i) { const r = Math.floor(i / COLS), c = i % COLS; return { x: GX + c * CW + CW / 2, y: GY + r * CH + CH / 2 }; }
function label(t) {
  if (t.str === null) return t.bytes.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ');
  return t.str.replace(/\n/g, '↵').replace(/ /g, '␣');
}

// illustrative attention: query token -> [target index, weight]
const Q = [
  { q: 5331, t0: 7.0, show: [17, 152, 150, 5324], targets: [[146, 1], [152, .8], [17, .7], [18, .7], [144, .9], [145, .9], [148, .6], [150, .55], [5324, .5]] },
  { q: 4618, t0: 13.6, show: [3958, 3950, 4614], targets: [[3958, 1], [3959, .8], [3950, .6], [3951, .6], [4614, .75], [4616, .5], [4617, .5]] },
];

function drawGrid(t, alpha) {
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `8px ${MONO}`;
  for (let i = 0; i < T.length; i++) {
    const { x, y } = cell(i);
    const sh = .32 + .22 * (0.5 + 0.5 * Math.sin(t * 1.3 + rnd(i, 2) * 6.28));
    ctx.fillStyle = rgba(DIM, alpha * sh);
    ctx.fillText(String(T[i].id), x, y);
  }
}

function arc(a, b, k, prog, w, side) {
  const dx = b.x - a.x, dy = b.y - a.y;
  const mx = (a.x + b.x) / 2;
  const sgn = mx < W / 2 ? 1 : -1;
  const bow = sgn * Math.min(360, 80 + Math.abs(dy) * .28) * (side ? 1 : .55);
  const cx = Math.max(GX + 10, Math.min(GX + GW - 10, mx + bow)), cy = (a.y + b.y) / 2;
  // draw the curve up to prog
  ctx.beginPath();
  const steps = 60, n = Math.max(1, Math.floor(steps * prog));
  for (let s = 0; s <= n; s++) {
    const u = s / steps;
    const x = (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * cx + u * u * b.x;
    const y = (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * cy + u * u * b.y;
    s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = rgba(ACC, k * (.25 + .55 * w)); ctx.lineWidth = 0.8 + 2.6 * w; ctx.stroke();
}

function tag(t, p, a, big) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const s = label(t);
  ctx.font = big ? `52px ${SERIF}` : `24px ${SERIF}`;
  if (t.str === null) ctx.font = big ? `30px ${MONO}` : `16px ${MONO}`;
  const x = p.x + (big ? 22 : 10), y = p.y;
  ctx.fillStyle = rgba(INK, a); ctx.fillText(s, x, y - (big ? 10 : 0));
  if (big) { ctx.font = `20px ${MONO}`; ctx.fillStyle = rgba(DIM, a); ctx.fillText(`ID ${t.id}`, x, y + 32); }
}

function dot(p, a, r) { ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fillStyle = rgba(INK, a); ctx.fill(); }

function stageRead(t) {
  const on = seg(t, 2.0, 2.6) * (1 - seg(t, 20.0, 22.0));
  if (on <= 0) return;
  drawGrid(t, on);
  Q.forEach((q, qi) => {
    const life = seg(t, q.t0, q.t0 + .6) * (1 - seg(t, q.t0 + 5.6, q.t0 + 6.4));
    if (life <= 0) return;
    const a = cell(q.q);
    q.targets.forEach(([ti, w], k) => {
      const prog = seg(t, q.t0 + .5 + k * .18, q.t0 + 2.2 + k * .18);
      if (prog <= 0) return;
      const b = cell(ti);
      arc(a, b, life * on, prog, w, qi === 0 ? (k % 2 === 0) : (k % 2 === 1));
      if (prog > .95) {
        dot(b, life * on, 2.5 + 3 * w);
        if (q.show.includes(ti)) tag(T[ti], b, life * on * (.55 + .45 * w), false);
      }
    });
    dot(a, life * on, 7);
    tag(T[q.q], a, life * on, true);
  });
  // caption
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `30px ${SANS}`; ctx.fillStyle = rgba(INK, on * .9); ctx.fillText('同時讀取', GX, 150);
  ctx.font = `22px ${MONO}`; ctx.fillStyle = rgba(DIM, on); ctx.textAlign = 'right';
  ctx.fillText(`${T.length.toLocaleString()} tokens · 1 step`, GX + GW, 150);
}

// ---------- speaking: the whole letter, one token at a time ----------
const RATE = 6, S0 = 23.5, MX = 90, MAXW = 900, FS = 44, LH = 100, ANCHOR = 1460, TOPCLIP = 250, BOTCLIP = 1760;
let G = null, TEND = 0, CUR = [];
const dec = b => { try { return new TextDecoder('utf-8', { fatal: true }).decode(Uint8Array.from(b)); } catch (e) { return null; } };
function buildSpeak() {
  // groups of tokens that together form whole characters
  G = []; let cur = [];
  T.forEach((t, i) => { cur.push(i); const s = dec(cur.flatMap(k => T[k].bytes)); if (s !== null) { G.push({ toks: cur, text: s }); cur = []; } });
  ctx.font = `${FS}px ${SERIF}`;
  let x = 0, y = 0;
  const newline = () => { x = 0; y += LH; };
  G.forEach(g => {
    g.pieces = [];
    const segs = g.text.split('\n');
    segs.forEach((seg, k) => {
      if (k > 0) {
        if (seg === '' && k < segs.length - 1) { newline(); y -= LH * .5; } // blank line: half height
        newline();
      }
      if (seg !== '') {
        const w = ctx.measureText(seg).width;
        if (x + w > MAXW && x > 0) newline();
        g.pieces.push({ s: seg, x, y, w }); x += w;
      }
    });
    if (g.pieces.length === 0) { // whitespace-only token: a quiet marker so its ID still has a place
      if (x + 22 > MAXW) newline();
      g.pieces.push({ s: '', x, y, w: 0, mark: true });
    }
    g.ax = g.pieces[0].x; g.ay = g.pieces[0].y;
    g.last = g.toks[g.toks.length - 1];
  });
  TEND = S0 + T.length / RATE;
  // cursor y for each token count, for smooth scrolling
  CUR = new Float32Array(T.length + 1);
  let gi = 0;
  for (let n = 0; n <= T.length; n++) { while (gi < G.length - 1 && G[gi].last < n) gi++; CUR[n] = G[gi].pieces[G[gi].pieces.length - 1].y; }
}
function scrollAt(t) {
  const n = clamp((t - S0) * RATE, 0, T.length);
  return CUR[Math.floor(n)];
}
function stageSpeak(t) {
  if (!G) buildSpeak();
  const on = seg(t, S0 - .8, S0) * (1 - seg(t, TEND + 6, TEND + 9));
  if (on <= 0) return;
  const n = (t - S0) * RATE;                 // tokens emitted (continuous)
  // smoothed scroll (average of the recent past)
  let sc = 0; for (let k = 0; k < 8; k++) sc += scrollAt(t - k * .09); sc /= 8;
  const off = ANCHOR - sc;
  ctx.save(); ctx.beginPath(); ctx.rect(0, TOPCLIP, W, BOTCLIP - TOPCLIP); ctx.clip();
  ctx.textBaseline = 'alphabetic';
  let head = null;
  for (const g of G) {
    const first = g.toks[0];
    if (first >= n) { if (!head) head = g; continue; }
    const yy = g.ay + off;
    if (yy < TOPCLIP - LH || yy > BOTCLIP + LH) continue;
    const done = g.last < n;
    const fresh = clamp((n - g.last) * 2.2, 0, 1);
    const fadeTop = clamp((yy - TOPCLIP) / 260, 0, 1);
    const a = on * fadeTop;
    if (done) {
      g.pieces.forEach(p => {
        if (p.mark) { ctx.font = `22px ${MONO}`; ctx.fillStyle = rgba(DIM, a * .7 * fresh); ctx.textAlign = 'left'; ctx.fillText('↵', MX + p.x, p.y + off); }
        else { ctx.font = `${FS}px ${SERIF}`; ctx.fillStyle = rgba(INK, a * fresh); ctx.textAlign = 'left'; ctx.fillText(p.s, MX + p.x, p.y + off); }
      });
      ctx.font = `11px ${MONO}`; ctx.fillStyle = rgba(DIM, a * .85 * fresh); ctx.textAlign = 'left';
      g.toks.forEach((k, r) => ctx.fillText(String(T[k].id), MX + g.ax, g.ay + off + 26 + r * 13));
    } else {
      // only the first byte fragment(s) exist yet: show them as hex
      const hx = g.toks.filter(k => k < n).map(k => T[k].bytes.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ')).join(' ');
      ctx.font = `18px ${MONO}`; ctx.fillStyle = rgba(DIM, a); ctx.textAlign = 'left';
      ctx.fillText(hx, MX + g.ax, g.ay + off - 10);
    }
  }
  // write head: flickering illustrative candidates where the next token will land
  if (head && t < TEND) {
    const k = Math.floor(t * 9);
    const alt = T[Math.floor(rnd(k, 7) * T.length)];
    const s = alt.str ? (alt.str.replace(/\s/g, '') || '·') : '·';
    ctx.font = `${FS}px ${SERIF}`; ctx.fillStyle = rgba(DIM, on * .45); ctx.textAlign = 'left';
    ctx.fillText([...s].slice(0, 2).join(''), MX + head.ax, head.ay + off);
  }
  ctx.restore();
  // header
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.font = `30px ${SANS}`; ctx.fillStyle = rgba(INK, on * .9); ctx.fillText('開口', GX, 150);
  ctx.font = `22px ${MONO}`; ctx.fillStyle = rgba(DIM, on); ctx.textAlign = 'right';
  ctx.fillText(`token ${Math.min(T.length, Math.max(0, Math.floor(n))).toLocaleString()} / ${T.length.toLocaleString()}`, GX + GW, 150);
}
function totalDuration() { if (!G) buildSpeak(); return TEND + 11; }

function draw(t) {
  if (!ROWS) { ROWS = Math.ceil(T.length / COLS); CW = GW / COLS; CH = GH / ROWS; }
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  stageRead(t);
  stageSpeak(t);
  // honesty footnote (always)
  const f = seg(t, 2.0, 2.6) * (1 - seg(t, TEND + 6, TEND + 9));
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.font = `19px ${SANS}`;
  ctx.fillStyle = rgba(DIM, f * .9);
  ctx.fillText('token 與 ID：o200k_base 實際切分　連線與候選字：示意', GX, 1830);
}
</script></body></html>
