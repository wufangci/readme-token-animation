<!doctype html><html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#fff;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080;
const ctx = document.getElementById('c').getContext('2d');
const SERIF = '"Noto Serif CJK TC"', MONO = '"DejaVu Sans Mono"';
let INK = '237,234,228', DIM = '140,140,140', ACC = '237,234,228', BG = '#000';
function setTheme(light) { if (light) { INK = '20,20,20'; DIM = '150,150,150'; ACC = '20,20,20'; BG = '#fff'; } }
let T = [], LINKS = [];
function setData(d, links) { T = d; LINKS = links; }

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const seg = (t, a, b) => ease((t - a) / (b - a));
const rnd = (i, k) => { const s = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return s - Math.floor(s); };
const rgba = (c, a) => `rgba(${c},${a})`;
const dec = b => { try { return new TextDecoder('utf-8', { fatal: true }).decode(Uint8Array.from(b)); } catch (e) { return null; } };

// ================= timeline =================
const GRID_IN = 2.0, DIM_A = 16.0, DIM_B = 22.0;           // flicker, then slowly darken
const L0 = 23.0, LSTEP = 8.8, LDUR = 9.6;                    // curves: ~70 s
let GRID_OUT, S0;
const RATE = 6;

// ================= grid =================
const COLS = 64, GX = 80, GY = 110, GW = 1760, GH = 880;
let ROWS, CW, CH;
function cell(i) { const r = Math.floor(i / COLS), c = i % COLS; return { x: GX + c * CW + CW / 2, y: GY + r * CH + CH / 2 }; }

// random bright/dark per token: stepped random levels, smoothly blended
function twinkle(i, t) {
  const rate = .8 + rnd(i, 3) * 2.2;                // each token flickers at its own pace
  const u = t * rate + rnd(i, 4) * 10;
  const k = Math.floor(u), f = u - k;
  const s = f * f * (3 - 2 * f);
  const a = rnd(i, k), b = rnd(i, k + 1);
  let v = a + (b - a) * s;
  v = Math.pow(v, 2.2);                            // mostly dark, occasional bright flashes
  return v;
}
function drawGrid(t) {
  const on = seg(t, GRID_IN, GRID_IN + .5) * (1 - seg(t, GRID_OUT, GRID_OUT + 3));
  if (on <= 0) return;
  const dimP = seg(t, DIM_A, DIM_B);               // 0 = full flicker, 1 = quiet and dark
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `8px ${MONO}`;
  for (let i = 0; i < T.length; i++) {
    const { x, y } = cell(i);
    const tw = twinkle(i, t);
    const lit = .12 + .88 * tw;                    // flicker phase
    const quiet = .10 + .06 * tw;                  // dimmed phase
    const a = on * (lit + (quiet - lit) * dimP);
    ctx.fillStyle = rgba(INK, a);
    ctx.fillText(String(T[i].id), x, y);
  }
}

// ================= curves =================
function textOf(toks) { return toks.map(k => T[k].str || '').join('').replace(/\s+/g, ''); }
function arc(a, b, k, prog, w, side) {
  const dy = b.y - a.y;
  const mx = (a.x + b.x) / 2;
  const sgn = (mx < W / 2 ? 1 : -1) * (side ? 1 : -1);
  const bow = sgn * Math.min(520, 140 + Math.abs(dy) * .55 + Math.abs(b.x - a.x) * .1);
  const cx = Math.max(GX + 10, Math.min(GX + GW - 10, mx + bow)), cy = (a.y + b.y) / 2 - Math.abs(b.x - a.x) * .15;
  ctx.beginPath();
  const steps = 80, n = Math.max(1, Math.floor(steps * prog));
  for (let s = 0; s <= n; s++) {
    const u = s / steps;
    const x = (1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * cx + u * u * b.x;
    const y = (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * cy + u * u * b.y;
    s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.strokeStyle = rgba(ACC, k * (.35 + .5 * w)); ctx.lineWidth = 1 + 2.4 * w; ctx.stroke();
}
function dot(p, a, r) { ctx.beginPath(); ctx.arc(p.x, p.y, r, 0, Math.PI * 2); ctx.fillStyle = rgba(INK, a); ctx.fill(); }
function label(p, s, a, big, ids) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  const x = p.x + (big ? 20 : 12), y = p.y;
  ctx.font = big ? `46px ${SERIF}` : `24px ${SERIF}`;
  // keep labels inside the frame
  const w = ctx.measureText(s).width;
  const xx = Math.min(x, W - 60 - w);
  ctx.fillStyle = rgba(INK, a); ctx.fillText(s, xx, y - (big ? 10 : 0));
  if (big) { ctx.font = `18px ${MONO}`; ctx.fillStyle = rgba(DIM, a); ctx.fillText(ids, xx, y + 28); }
}
function drawLinks(t) {
  LINKS.forEach((L, li) => {
    const t0 = L0 + li * LSTEP;
    const life = seg(t, t0, t0 + .8) * (1 - seg(t, t0 + LDUR - 1.4, t0 + LDUR));
    if (life <= 0) return;
    const a = cell(L.q[0]);
    L.targets.forEach((tg, k) => {
      const w = 1 - k * .22;
      const prog = seg(t, t0 + .8 + k * .9, t0 + 4.2 + k * .9);
      if (prog <= 0) return;
      const b = cell(tg[0]);
      arc(a, b, life, prog, w, k % 2 === 0);
      if (prog > .97) { dot(b, life, 3 + 3 * w); label(b, textOf(tg), life * (.6 + .4 * w), false); }
    });
    dot(a, life, 7);
    label(a, textOf(L.q), life, true, L.q.map(k => 'ID ' + T[k].id).join('  '));
  });
}

// ================= speaking =================
const MX = 360, MAXW = 1200, FS = 40, LH = 92, ANCHOR = 790, TOPCLIP = 110, BOTCLIP = 1010;
let G = null, TEND = 0, CUR = null;
function buildSpeak() {
  G = []; let cur = [];
  T.forEach((t, i) => { cur.push(i); const s = dec(cur.flatMap(k => T[k].bytes)); if (s !== null) { G.push({ toks: cur, text: s }); cur = []; } });
  ctx.font = `${FS}px ${SERIF}`;
  let x = 0, y = 0;
  const newline = () => { x = 0; y += LH; };
  G.forEach(g => {
    g.pieces = [];
    const segs = g.text.split('\n');
    segs.forEach((sg, k) => {
      if (k > 0) { if (sg === '' && k < segs.length - 1) { newline(); y -= LH * .5; } newline(); }
      if (sg !== '') { const w = ctx.measureText(sg).width; if (x + w > MAXW && x > 0) newline(); g.pieces.push({ s: sg, x, y, w }); x += w; }
    });
    if (g.pieces.length === 0) { if (x + 22 > MAXW) newline(); g.pieces.push({ s: '', x, y, w: 0, mark: true }); }
    g.ax = g.pieces[0].x; g.ay = g.pieces[0].y; g.last = g.toks[g.toks.length - 1];
  });
  TEND = S0 + T.length / RATE;
  CUR = new Float32Array(T.length + 1);
  let gi = 0;
  for (let n = 0; n <= T.length; n++) { while (gi < G.length - 1 && G[gi].last < n) gi++; CUR[n] = G[gi].pieces[G[gi].pieces.length - 1].y; }
}
function scrollAt(t) { return CUR[Math.floor(clamp((t - S0) * RATE, 0, T.length))]; }
function drawSpeak(t) {
  const on = seg(t, S0 - .8, S0) * (1 - seg(t, TEND + 6, TEND + 9));
  if (on <= 0) return;
  const n = (t - S0) * RATE;
  let sc = 0; for (let k = 0; k < 8; k++) sc += scrollAt(t - k * .09); sc /= 8;
  const off = ANCHOR - sc;
  ctx.save(); ctx.beginPath(); ctx.rect(0, TOPCLIP, W, BOTCLIP - TOPCLIP); ctx.clip();
  ctx.textBaseline = 'alphabetic';
  let head = null;
  for (const g of G) {
    if (g.toks[0] >= n) { if (!head) head = g; continue; }
    const yy = g.ay + off;
    if (yy < TOPCLIP - LH || yy > BOTCLIP + LH) continue;
    const done = g.last < n;
    const fresh = clamp((n - g.last) * 2.2, 0, 1);
    const a = on * clamp((yy - TOPCLIP) / 240, 0, 1);
    if (done) {
      g.pieces.forEach(p => {
        ctx.textAlign = 'left';
        if (p.mark) { ctx.font = `20px ${MONO}`; ctx.fillStyle = rgba(DIM, a * .7 * fresh); ctx.fillText('↵', MX + p.x, p.y + off); }
        else { ctx.font = `${FS}px ${SERIF}`; ctx.fillStyle = rgba(INK, a * fresh); ctx.fillText(p.s, MX + p.x, p.y + off); }
      });
      ctx.font = `11px ${MONO}`; ctx.fillStyle = rgba(DIM, a * .85 * fresh); ctx.textAlign = 'left';
      g.toks.forEach((k, r) => ctx.fillText(String(T[k].id), MX + g.ax, g.ay + off + 24 + r * 13));
    } else {
      const hx = g.toks.filter(k => k < n).map(k => T[k].bytes.map(b => b.toString(16).toUpperCase().padStart(2, '0')).join(' ')).join(' ');
      ctx.font = `17px ${MONO}`; ctx.fillStyle = rgba(DIM, a); ctx.textAlign = 'left';
      ctx.fillText(hx, MX + g.ax, g.ay + off - 10);
    }
  }
  if (head && t < TEND) {
    const alt = T[Math.floor(rnd(Math.floor(t * 9), 7) * T.length)];
    const s = alt.str ? (alt.str.replace(/\s/g, '') || '·') : '·';
    ctx.font = `${FS}px ${SERIF}`; ctx.fillStyle = rgba(DIM, on * .45); ctx.textAlign = 'left';
    ctx.fillText([...s].slice(0, 2).join(''), MX + head.ax, head.ay + off);
  }
  ctx.restore();
}

// ================= counter (top right only) =================
function drawCounter(t) {
  const g = seg(t, GRID_IN, GRID_IN + .5) * (1 - seg(t, GRID_OUT, GRID_OUT + 3));
  const s = seg(t, S0 - .8, S0) * (1 - seg(t, TEND + 6, TEND + 9));
  ctx.font = `20px ${MONO}`; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  if (g > 0) { ctx.fillStyle = rgba(DIM, g); ctx.fillText(`${T.length.toLocaleString()} tokens`, W - 80, 70); }
  if (s > 0) {
    const n = Math.min(T.length, Math.max(0, Math.floor((t - S0) * RATE)));
    ctx.fillStyle = rgba(DIM, s); ctx.fillText(`token ${n.toLocaleString()} / ${T.length.toLocaleString()}`, W - 80, 70);
  }
}

function init() {
  ROWS = Math.ceil(T.length / COLS); CW = GW / COLS; CH = GH / ROWS;
  GRID_OUT = L0 + (LINKS.length - 1) * LSTEP + LDUR + .5;
  S0 = GRID_OUT + 4.5;
  buildSpeak();
}
function totalDuration() { if (!G) init(); return TEND + 11; }
function draw(t) {
  if (!G) init();
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  drawGrid(t);
  drawLinks(t);
  drawSpeak(t);
  drawCounter(t);
}
</script>
<script>
// ======== fog demo: thousands of faint relations, then a few clear curves ========
const F_IN = 1.0, F_DIM_A = 6.0, F_DIM_B = 8.0, FOG_A = 8.5, FOG_B = 36.0, FOG_OUT_A = 38.5, FOG_OUT_B = 44.0, END_A = 50.5, END_B = 53.5, GROW = 1.8;
let FOG = null, PUNCT = [];
function buildFog() {
  T.forEach((t, i) => { if (t.str && /[，。：？！「」\n]/.test(t.str)) PUNCT.push(i); });
  FOG = [];
  const N = 4200;
  for (let k = 0; k < N; k++) {
    const q = Math.floor(rnd(k, 11) * (T.length - 10)) + 10;
    const r = rnd(k, 12);
    let tg;
    if (r < .45) tg = Math.max(0, q - 1 - Math.floor(rnd(k, 13) * COLS * 2));          // nearby: the last couple of lines
    else if (r < .72) { const c = PUNCT.filter(p => p < q); tg = c.length ? c[Math.floor(rnd(k, 14) * c.length)] : 0; } // punctuation & line breaks
    else if (r < .85) tg = 0;                                                         // the very first token
    else tg = Math.floor(rnd(k, 15) * q);                                             // anywhere earlier
    FOG.push({ q, tg, w: k < 80 ? .85 + .15 * rnd(k, 16) : .3 + .7 * Math.pow(rnd(k, 16), 3), side: rnd(k, 17) < .5, st: FOG_A + (FOG_B - GROW - FOG_A) * Math.pow(k / N, 1 / 3) });
  }
}
function faint(a, b, alpha, side, prog) {
  const mx = (a.x + b.x) / 2, dy = b.y - a.y;
  const bow = (side ? 1 : -1) * Math.min(260, 30 + Math.abs(dy) * .35);
  const cx = Math.max(GX, Math.min(GX + GW, mx + bow)), cy = (a.y + b.y) / 2;
  ctx.beginPath(); ctx.moveTo(a.x, a.y);
  if (prog >= 1) ctx.quadraticCurveTo(cx, cy, b.x, b.y);
  else {
    const steps = 28, n = Math.max(1, Math.ceil(steps * prog));
    for (let s = 1; s <= n; s++) {
      const u = Math.min(prog, s / steps);
      ctx.lineTo((1 - u) * (1 - u) * a.x + 2 * (1 - u) * u * cx + u * u * b.x, (1 - u) * (1 - u) * a.y + 2 * (1 - u) * u * cy + u * u * b.y);
    }
  }
  ctx.strokeStyle = rgba(ACC, alpha); ctx.stroke();
}
const KEEP = [0, 7];   // 「你」 and 「家」
function draw(t) {
  if (!G) init();
  if (!FOG) buildFog();
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const end = 1 - seg(t, END_A, END_B);
  // grid: appear, flicker, dim
  const on = seg(t, F_IN, F_IN + .5) * end;
  const dimP = seg(t, F_DIM_A, F_DIM_B);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = `8px ${MONO}`;
  for (let i = 0; i < T.length; i++) {
    const { x, y } = cell(i); const tw = twinkle(i, t);
    const a = on * ((.12 + .88 * tw) + ((.10 + .06 * tw) - (.12 + .88 * tw)) * dimP);
    ctx.fillStyle = rgba(INK, a); ctx.fillText(String(T[i].id), x, y);
  }
  // fog: all relations at once
  const fog = (1 - seg(t, FOG_OUT_A, FOG_OUT_B)) * end;
  if (fog > 0 && t >= FOG_A) {
    ctx.lineWidth = 1;
    FOG.forEach((f, k) => {
      if (t < f.st) return;
      const prog = ease((t - f.st) / GROW);
      const head = 1 + .8 * (1 - clamp((t - f.st) / (GROW + .6), 0, 1));   // a line is a little darker while it grows
      const flick = .8 + .2 * Math.sin(t * 1.7 + k);
      faint(cell(f.q), cell(f.tg), fog * f.w * .2 * flick * head * (k < 80 ? 2.2 : 1), f.side, prog);
      if (prog < 1) dot(cell(f.q), fog * .5, 1.6);
    });
  }
  // the few clear curves emerge as the fog recedes
  const clear = seg(t, FOG_OUT_A + 1.0, FOG_OUT_B + .5) * end;
  const PLACED = [];
  if (clear > 0) {
    KEEP.forEach(li => {
      const L = LINKS[li], a = cell(L.q[0]);
      L.targets.forEach((tg, k) => {
        const w = 1 - k * .22, b = cell(tg[0]);
        arc(a, b, clear, 1, w, k % 2 === 0);
        dot(b, clear, 3 + 3 * w);
        let ly = b.y;
        while (PLACED.some(p => Math.abs(p.y - ly) < 26 && Math.abs(p.x - b.x) < 320)) ly += 28;
        PLACED.push({ x: b.x, y: ly });
        label({ x: b.x, y: ly }, textOf(tg), clear * (.6 + .4 * w), false);
      });
      dot(a, clear, 7); label(a, textOf(L.q), clear, true, L.q.map(k => 'ID ' + T[k].id).join('  '));
    });
  }
  // counter only
  ctx.font = `20px ${MONO}`; ctx.textAlign = 'right'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = rgba(DIM, on); ctx.fillText(`${T.length.toLocaleString()} tokens`, W - 80, 70);
}
function totalDuration() { return 54; }
</script></body></html>
